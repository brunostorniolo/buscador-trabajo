name: Buscar ofertas

on:
  schedule:
    - cron: "17 10 * * *"  # 10:17 UTC = 7:17 en Argentina; GitHub suele atrasarlo, así que está a las 9 o antes
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar ofertas y generar la página
        run: python buscador.py
        env:
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}

      - name: Guardar resultados
        run: |
          git config user.name "buscador-bot"
          git config user.email "buscador-bot@users.noreply.github.com"
          git add ofertas.db docs/index.html
          git diff --cached --quiet || git commit -m "Ofertas $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d')"
          git push
