const ACTUALIZADO = "2026-10-27 07:06";
const HOY = ACTUALIZADO.slice(0, 10);

let filtro = "Todas";
const perfiles = ["Todas", "Nuevas hoy", ...new Set(OFERTAS.map(o => o.perfil))];

document.getElementById("sub").textContent =
  `${OFERTAS.length} ofertas · actualizado ${ACTUALIZADO}`;

const chips = document.getElementById("chips");
for (const p of perfiles) {
  const b = document.createElement("button");
  b.className = "chip" + (p === filtro ? " on" : "");
  b.textContent = p;
  b.onclick = () => { filtro = p; chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b)); pintar(); };
  chips.appendChild(b);
}

function color(p) { return p >= 60 ? "var(--alto)" : p >= 45 ? "var(--medio)" : "var(--bajo)"; }

function el(tag, cls, texto) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texto) e.textContent = texto;
  return e;
}

function pintar() {
  const q = document.getElementById("buscar").value.trim().toLowerCase();
  const lista = document.getElementById("lista");
  lista.replaceChildren();
  const visibles = OFERTAS.filter(o =>
    (filtro === "Todas" || (filtro === "Nuevas hoy" ? (o.encontrada_en || "").startsWith(HOY) : o.perfil === filtro)) &&
    (!q || `${o.titulo} ${o.empresa} ${o.ubicacion}`.toLowerCase().includes(q)));

  if (!visibles.length) { lista.appendChild(el("p", "vacio", "No hay ofertas con ese filtro.")); return; }

  for (const o of visibles) {
    const a = el("a", "card");
    a.href = o.url; a.target = "_blank"; a.rel = "noopener";
    const top = el("div", "top");
    const s = el("div", "score", String(o.puntaje));
    s.style.background = color(o.puntaje);
    const info = el("div");
    info.append(el("p", "titulo", o.titulo), el("p", "empresa", o.empresa || "—"));
    top.append(s, info);

    const meta = el("div", "meta");
    if ((o.encontrada_en || "").startsWith(HOY)) meta.appendChild(el("span", "nueva", "● Nueva"));
    for (const t of [o.perfil, o.ubicacion, o.salario, o.publicada, o.fuente]) if (t) meta.appendChild(el("span", "", t));

    a.append(top, meta);
    if (o.resumen) a.appendChild(el("p", "resumen", o.resumen));
    lista.appendChild(a);
  }
}

document.getElementById("buscar").addEventListener("input", pintar);
pintar();
</script>
